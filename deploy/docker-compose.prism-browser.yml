# Optional browser adapter. Its availability never gates the main application.
services:
  prism-browser:
    build:
      context: ../tools/prism-browser
    image: local/sub2api-prism-browser:0.1.0
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      PRISM_MANAGEMENT_KEY: "${PRISM_MANAGEMENT_KEY:?Set PRISM_MANAGEMENT_KEY}"
      PRISM_HOST: "0.0.0.0"
      PRISM_PORT: "8319"
      PRISM_DATA_DIR: "/data"
      PRISM_REQUEST_TIMEOUT: "${PRISM_REQUEST_TIMEOUT:-1800}"
      PRISM_BODY_LIMIT: "${PRISM_BODY_LIMIT:-8388608}"
      PRISM_MAX_ATTACHMENTS: "${PRISM_MAX_ATTACHMENTS:-8}"
      PRISM_MAX_ATTACHMENT_BYTES: "${PRISM_MAX_ATTACHMENT_BYTES:-10485760}"
      PRISM_MAX_TOTAL_ATTACHMENT_BYTES: "${PRISM_MAX_TOTAL_ATTACHMENT_BYTES:-20971520}"
      PRISM_MAX_TRANSCRIPT_CHARS: "${PRISM_MAX_TRANSCRIPT_CHARS:-32000}"
      PRISM_QUEUE_LIMIT: "${PRISM_QUEUE_LIMIT:-8}"
      PRISM_MAX_ACCOUNTS: "${PRISM_MAX_ACCOUNTS:-16}"
      PRISM_ACCOUNT_CONCURRENCY: "${PRISM_ACCOUNT_CONCURRENCY:-2}"
      PRISM_MAX_WORKERS: "${PRISM_MAX_WORKERS:-32}"
      PRISM_ACCOUNT_START_LIMIT: "${PRISM_ACCOUNT_START_LIMIT:-0}"
      PRISM_START_WINDOW_SECONDS: "${PRISM_START_WINDOW_SECONDS:-65}"
      PRISM_TRANSIENT_RETRIES: "${PRISM_TRANSIENT_RETRIES:-1}"
      PRISM_TRANSIENT_RETRY_DELAY_SECONDS: "${PRISM_TRANSIENT_RETRY_DELAY_SECONDS:-4}"
      PRISM_TRANSIENT_RETRY_WAIT_SECONDS: "${PRISM_TRANSIENT_RETRY_WAIT_SECONDS:-15}"
    volumes:
      - "${PRISM_BROWSER_DATA_DIR:-./prism-browser-data}:/data"
    # Local publication also supports a host-network Sub2API deployment.
    ports:
      - "${PRISM_BROWSER_BIND:-127.0.0.1:8319}:8319"
    expose:
      - "8319"
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8319/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sub2api-network:
    driver: bridge
