# Optional browser adapter. Its availability never gates the main application.
services:
  prism-browser:
    build:
      context: ../tools/prism-browser
    image: local/sub2api-prism-browser:0.1.0
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      PRISM_MANAGEMENT_KEY: "${PRISM_MANAGEMENT_KEY:?Set PRISM_MANAGEMENT_KEY}"
      PRISM_HOST: "0.0.0.0"
      PRISM_PORT: "8319"
      PRISM_DATA_DIR: "/data"
      PRISM_REQUEST_TIMEOUT: "${PRISM_REQUEST_TIMEOUT:-1800}"
      PRISM_BODY_LIMIT: "${PRISM_BODY_LIMIT:-8388608}"
      PRISM_MAX_ATTACHMENTS: "${PRISM_MAX_ATTACHMENTS:-8}"
      PRISM_MAX_ATTACHMENT_BYTES: "${PRISM_MAX_ATTACHMENT_BYTES:-10485760}"
      PRISM_MAX_TOTAL_ATTACHMENT_BYTES: "${PRISM_MAX_TOTAL_ATTACHMENT_BYTES:-20971520}"
      PRISM_MAX_TRANSCRIPT_CHARS: "${PRISM_MAX_TRANSCRIPT_CHARS:-32000}"
      PRISM_QUEUE_LIMIT: "${PRISM_QUEUE_LIMIT:-8}"
      PRISM_MAX_ACCOUNTS: "${PRISM_MAX_ACCOUNTS:-16}"
      PRISM_ACCOUNT_CONCURRENCY: "${PRISM_ACCOUNT_CONCURRENCY:-2}"
      PRISM_MAX_WORKERS: "${PRISM_MAX_WORKERS:-32}"
      # Opt-in (default false = the shared managed project per worker, as before). When true, user requests
      # run in a project scoped to authenticated Key + explicit session; anonymous requests get a fresh project.
      PRISM_PROJECT_ISOLATION: "${PRISM_PROJECT_ISOLATION:-false}"
      PRISM_MAX_SESSION_PROJECTS: "${PRISM_MAX_SESSION_PROJECTS:-128}"
      PRISM_SESSION_PROJECT_TTL_SECONDS: "${PRISM_SESSION_PROJECT_TTL_SECONDS:-86400}"
      # Admission guard counts the container (including Chromium), not only Node RSS. 0 (default) disables it:
      # set it from /internal/resources measurements, never from a guess.
      PRISM_MEMORY_LIMIT_MIB: "${PRISM_MEMORY_LIMIT_MIB:-0}"
      PRISM_MEMORY_RESERVE_MIB: "${PRISM_MEMORY_RESERVE_MIB:-32}"
      # Opt-in (default false = the Playwright route guard production runs today, HTTP cache disabled).
      # true switches to Chromium CDP interception (static-asset caching) and blocks service workers.
      PRISM_HTTP_CACHE: "${PRISM_HTTP_CACHE:-false}"
      # Experimental: release accepted submission pages to an account-bound resident poller.
      PRISM_MULTIPLEX_PAGES: "${PRISM_MULTIPLEX_PAGES:-false}"
      PRISM_ACCOUNT_START_LIMIT: "${PRISM_ACCOUNT_START_LIMIT:-0}"
      PRISM_START_WINDOW_SECONDS: "${PRISM_START_WINDOW_SECONDS:-65}"
      # Blank inherits the legacy capacity (default 0); do not mask an existing start limit.
      PRISM_START_BURST: "${PRISM_START_BURST:-}"
      # Blank derives seconds per token from the legacy window / capacity.
      PRISM_START_REFILL_SECONDS: "${PRISM_START_REFILL_SECONDS:-}"
      # Blank defaults to the initial refill interval.
      PRISM_START_REFILL_MIN_SECONDS: "${PRISM_START_REFILL_MIN_SECONDS:-}"
      # Blank defaults to max(90 seconds, initial refill), preserving slower legacy pacing.
      PRISM_START_REFILL_MAX_SECONDS: "${PRISM_START_REFILL_MAX_SECONDS:-}"
      # Blank defaults to max(15 seconds, initial refill), or 15 without a start limit; only applies with a backup account.
      PRISM_START_MAX_WAIT_SECONDS: "${PRISM_START_MAX_WAIT_SECONDS:-}"
      # Minimum pause after Prism refuses a start; token replenishment may take longer.
      PRISM_START_COOLDOWN_SECONDS: "${PRISM_START_COOLDOWN_SECONDS:-60}"
      # Independent poll interval; 0 disables, otherwise 250-10000 milliseconds.
      PRISM_STATUS_POLL_MS: "${PRISM_STATUS_POLL_MS:-600}"
      # Estimated prompt-cache lifetime; 0 disables cache-read estimates.
      PRISM_PROMPT_CACHE_TTL_SECONDS: "${PRISM_PROMPT_CACHE_TTL_SECONDS:-600}"
      PRISM_TRANSIENT_RETRIES: "${PRISM_TRANSIENT_RETRIES:-1}"
      PRISM_TRANSIENT_RETRY_DELAY_SECONDS: "${PRISM_TRANSIENT_RETRY_DELAY_SECONDS:-4}"
      PRISM_TRANSIENT_RETRY_WAIT_SECONDS: "${PRISM_TRANSIENT_RETRY_WAIT_SECONDS:-15}"
      # Prepare the next chat while idle; forward Prism's progress notes as reasoning events.
      PRISM_PREWARM_CHAT: "${PRISM_PREWARM_CHAT:-true}"
      PRISM_STREAM_REASONING: "${PRISM_STREAM_REASONING:-true}"
    volumes:
      - "${PRISM_BROWSER_DATA_DIR:-./prism-browser-data}:/data"
    # Local publication also supports a host-network Sub2API deployment.
    ports:
      - "${PRISM_BROWSER_BIND:-127.0.0.1:8319}:8319"
    expose:
      - "8319"
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8319/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sub2api-network:
    driver: bridge
