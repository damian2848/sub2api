# Include inside the HTTPS server block that proxies Sub2API.
# Fingerprinted assets keep the application's immutable Cache-Control header.
# Keep this separate from API/SSE routes, which require unbuffered streaming.
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/wasm image/svg+xml;
}
