name: Prism browser

on:
  push:
    paths:
      - 'tools/prism-browser/**'
      - 'deploy/*prism-browser*'
      - 'deploy/PRISM_BROWSER.md'
      - '.github/workflows/prism-browser-ci.yml'
  pull_request:
    paths:
      - 'tools/prism-browser/**'
      - 'deploy/*prism-browser*'
      - 'deploy/PRISM_BROWSER.md'
      - '.github/workflows/prism-browser-ci.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: tools/prism-browser
    steps:
      - uses: actions/checkout@v6
      - name: Install locked adapter dependencies
        run: npm ci --ignore-scripts
      - name: Offline unit tests
        run: npm test
      - name: Real Chromium offline smoke (no production credentials)
        run: npm run test:smoke
